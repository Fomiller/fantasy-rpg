syntax = "proto3";

// One file on purpose: Godobuf cannot resolve imports laid out the way buf requires.
package game.v1;

// Envelopes. Every WebSocket frame carries exactly one of these.

message ClientMessage {
  uint32 protocol_version = 1;
  oneof payload {
    JoinRequest join = 10;
    MoveInput move = 11;
    AttackRequest attack = 12;
    PickupRequest pickup = 13;
    EquipRequest equip = 14;
    UnequipRequest unequip = 15;
    DropRequest drop = 16;
    UseRequest use = 17;
    LootOpenRequest loot_open = 18;
    LootCloseRequest loot_close = 19;
  }
}

message ServerMessage {
  uint32 protocol_version = 1;
  oneof payload {
    JoinAccepted joined = 10;
    WorldSnapshot snapshot = 11;
    DamageEvent damage = 12;
    InventoryUpdated inventory = 13;
    Extracted extracted = 14;
    EquipmentUpdated equipment = 15;
    AbilityUsed ability_used = 16;
    AbilityRejected ability_rejected = 17;
    LootContents loot = 18;
    PickupRejected pickup_rejected = 19;
  }
}

message Vec2 {
  float x = 1;
  float y = 2;
}

message Rect {
  Vec2 min = 1;
  Vec2 max = 2;
}

// Player

message JoinRequest {
  string name = 1;
  // Empty means warrior. An unknown class closes the connection.
  string class_id = 2;
}

message JoinAccepted {
  uint64 player_id = 1;
  CaveLayout cave = 2;
  Vec2 spawn = 3;
  // The client predicts its own movement one step per server tick.
  uint32 tick_rate = 4;
  // Named class_info because Godobuf would make get_class(), which Godot
  // already has on every Object.
  ClassInfo class_info = 5;
}

// ClassInfo is the player's own class. The client has no class data files,
// so it builds its ability bar from this.
message ClassInfo {
  string id = 1;
  string name = 2;
  // What the resource is called, like rage.
  string resource = 3;
  int32 max_resource = 4;
  // The id the basic attack has. AttackRequest can also send "basic".
  string basic = 5;
  repeated AbilityInfo abilities = 6;
}

message AbilityInfo {
  string id = 1;
  string name = 2;
  int32 cost = 3;
  uint32 cooldown_ms = 4;
  uint32 windup_ms = 5;
  // The caster cannot move during the windup.
  bool root = 6;
}

// Extracted is sent to everyone in the cave. The extracting player's
// connection closes right after.
message Extracted {
  uint64 player_id = 1;
}

// MoveInput is sent once per tick. The server uses one per tick, in seq order.
message MoveInput {
  uint32 seq = 1;
  Vec2 direction = 2;
}

// Combat

// AttackRequest asks for any ability, not just the basic attack.
message AttackRequest {
  uint32 seq = 1;
  // Only used to aim when aim is zero.
  uint64 target_id = 2;
  // An ability id, or "basic" for the class's basic attack.
  string ability_id = 3;
  // Direction to use the ability in, like toward the mouse.
  Vec2 aim = 4;
}

// AbilityUsed is sent to everyone when an ability's windup starts. The hits
// come later as DamageEvents.
message AbilityUsed {
  uint64 source_id = 1;
  string ability_id = 2;
  Vec2 aim = 3;
  uint32 windup_ms = 4;
  // Can be shorter than AbilityInfo says, from attack_speed.
  uint32 cooldown_ms = 5;
}

// AbilityRejected is sent to the caster only.
message AbilityRejected {
  uint32 seq = 1;
  string ability_id = 2;
  // One of unknown, busy, cooldown, resource, aim.
  string reason = 3;
}

message DamageEvent {
  uint64 source_id = 1;
  uint64 target_id = 2;
  int32 amount = 3;
  int32 target_health = 4;
  bool killed = 5;
}

// World

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_ENEMY = 2;
  ENTITY_KIND_CHEST = 3;
  // Loot on the ground. It goes away once someone picks all of it up.
  ENTITY_KIND_LOOT = 4;
  // An enemy's shot. The client moves it by velocity between snapshots.
  ENTITY_KIND_PROJECTILE = 5;
}

enum EnemyState {
  ENEMY_STATE_UNSPECIFIED = 0;
  ENEMY_STATE_IDLE = 1;
  ENEMY_STATE_PATROL = 2;
  ENEMY_STATE_DETECT = 3;
  ENEMY_STATE_CHASE = 4;
  ENEMY_STATE_ATTACK = 5;
  ENEMY_STATE_SEARCH = 6;
  ENEMY_STATE_RETREAT = 7;
  ENEMY_STATE_RETURN = 8;
  ENEMY_STATE_CHARGE = 9;
  ENEMY_STATE_DEAD = 10;
}

message EntityState {
  uint64 id = 1;
  EntityKind kind = 2;
  Vec2 position = 3;
  Vec2 velocity = 4;
  int32 health = 5;
  // 0 to 1 while a player stands in the extraction zone.
  float extract_progress = 6;
  int32 max_health = 7;
  // Players only. The last MoveInput seq the server applied, so the client
  // knows which of its predicted inputs to replay.
  uint32 last_input_seq = 8;
  float max_speed = 9;
  // Chests and loot only.
  uint32 item_count = 10;
  // Enemies only. archetype is data, like an item def id, so it is a string.
  string archetype = 11;
  EnemyState enemy_state = 12;
  // Where the enemy faces during detect, attack and charge. The client draws
  // the telegraph from it.
  Vec2 aim = 13;
  // Players only.
  string class_id = 14;
  int32 resource = 15;
  int32 max_resource = 16;
}

message WorldSnapshot {
  uint64 tick = 1;
  repeated EntityState entities = 2;
}

// Cave

// CaveLayout is everything the client needs to draw the cave. Bounds is the
// whole map, and anything outside a wall inside bounds is floor.
message CaveLayout {
  string name = 1;
  Rect bounds = 2;
  repeated Rect walls = 3;
  Rect extraction = 4;
}

// Inventory

enum Rarity {
  RARITY_UNSPECIFIED = 0;
  RARITY_COMMON = 1;
  RARITY_UNCOMMON = 2;
  RARITY_RARE = 3;
  RARITY_EPIC = 4;
  RARITY_UNIQUE = 5;
}

// Item carries everything the client shows. The client has no item data
// files, so names and stats always come from the server.
message Item {
  string id = 1;
  string item_def_id = 2;
  uint32 quantity = 3;
  string name = 4;
  string slot = 5;
  Rarity rarity = 6;
  uint32 level = 7;
  repeated ItemStat base = 8;
  repeated ItemAffix affixes = 9;
}

message ItemStat {
  string stat = 1;
  int32 value = 2;
}

message ItemAffix {
  string name = 1;
  string stat = 2;
  int32 value = 3;
  uint32 tier = 4;
}

// EquipmentUpdated is the full set of equipped items, sent to that player
// whenever it changes.
message EquipmentUpdated {
  repeated Item items = 1;
  // Class base plus gear, as the server uses them. Unarmed damage and the
  // move_speed cap are already applied. Gear is the only thing that changes them.
  repeated ItemStat stats = 2;
}

// InventoryUpdated is everything in the player's bag, sent to that player
// whenever it changes.
message InventoryUpdated {
  repeated Item items = 1;
  uint32 capacity = 2;
}

// Item requests. The server ignores one it cannot do, like an equip of an
// item the player does not have, and the next InventoryUpdated shows what
// really happened. A pickup it cannot do gets a PickupRejected.

// PickupRequest takes one item from a chest or loot entity, or everything
// that fits.
message PickupRequest {
  uint64 target_id = 1;
  // An item id from LootContents. Empty takes everything that fits.
  string item_id = 2;
}

// PickupRejected is sent to the player whose pickup took nothing.
message PickupRejected {
  uint64 target_id = 1;
  string item_id = 2;
  // One of range, gone, bag_full.
  string reason = 3;
}

// LootOpenRequest opens a loot window on a chest or loot entity. The server
// answers with LootContents, and sends it again whenever the contents change,
// until the window closes.
message LootOpenRequest {
  uint64 target_id = 1;
}

// LootCloseRequest stops the LootContents for that window.
message LootCloseRequest {
  uint64 target_id = 1;
}

// LootContents is what a loot window shows. Only the player who has the
// window open gets it.
message LootContents {
  uint64 target_id = 1;
  repeated Item items = 2;
  // The server closed the window: the player walked out of range or died, or
  // the pile is empty or gone. An open request from too far away gets this.
  bool closed = 3;
}

// EquipRequest moves an item from the bag to its slot. Whatever was in the
// slot goes back to the bag.
message EquipRequest {
  string item_id = 1;
}

message UnequipRequest {
  string slot = 1;
}

// DropRequest puts a whole bag entry on the ground at the player's feet.
message DropRequest {
  string item_id = 1;
}

// UseRequest uses one of a consumable, like drinking a potion.
message UseRequest {
  string item_id = 1;
}
