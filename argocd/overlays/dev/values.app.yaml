# Written once, then it is yours. `nix run .#generate` never touches it again.
#
# dev overrides, layered on ../values.app.base.yaml. Only keys that differ
# from the base belong here.
#
# Kargo rewrites image.tag on every promotion. It only replaces the key, so
# the key has to exist. 0.1.0 is the first published image.
image:
  tag: 0.22.0@sha256:dc8d24d68c4ef0872e4a40dbed06ad5122eaa2186d1846b4b7971a1eb7365bc4

# The Cloudflare tunnel forwards this hostname to Traefik because homelab lists
# it in public_hostnames. Clients connect to wss://fantasy-rpg.fomiller.com/ws,
# the world server, which sends them on to /instances/<pod>/ws.
ingressRoute:
  host: fantasy-rpg.fomiller.com

# The CNPG Cluster and migrate Job. The server reads DATABASE_URL from the
# Secret CNPG makes, so nothing else here changes.
postgres:
  enabled: true

# The in-cluster Redpanda from argocd/redpanda. No TLS or SASL.
events:
  brokers: redpanda.fantasy-rpg.svc:9093

# kube-prometheus-stack only picks up monitors labelled with its release.
metrics:
  podMonitors: true
  labels:
    release: prometheus
