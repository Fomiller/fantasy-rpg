apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deployed as part of argocd/overlays/dev, so it syncs with the fantasy-rpg
# Application.
#
# No top-level namespace. The chart puts a PDB and the SDK's RBAC into each
# namespace in gameservers.namespaces, and a namespace transformer would pull
# them into agones-system.
resources:
- namespace.yaml
- certificate.yaml

helmCharts:
- name: agones
  repo: https://agones.dev/chart/stable
  version: 1.61.0
  releaseName: agones
  namespace: agones-system
  valuesFile: values.yaml

# fleets, gameserversets and gameservers are each over 500 KB. Client-side
# apply would overflow the 262144-byte last-applied-configuration annotation.
patches:
- target:
    kind: CustomResourceDefinition
  patch: |-
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: unused
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
# The chart leaves the namespace off this one PDB, and this Application's
# destination is fantasy-rpg.
- target:
    kind: PodDisruptionBudget
    name: agones-extensions-pdb
  patch: |-
    - op: add
      path: /metadata/namespace
      value: agones-system
