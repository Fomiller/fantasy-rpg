apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Agones is cluster-wide: CRDs, webhooks, an APIService. So it is its own
# Application, k8s/apps/agones in homelab, and not part of the dev overlay.
# The services AppProject would refuse those kinds, and a second stage would
# install Agones twice.
#
# No top-level namespace. The chart puts a PDB and the SDK's RBAC into each
# namespace in gameservers.namespaces, and a namespace transformer would pull
# them into agones-system.
resources:
- namespace.yaml
- certificate.yaml

helmCharts:
- name: agones
  repo: https://agones.dev/chart/stable
  version: 1.61.0
  releaseName: agones
  namespace: agones-system
  valuesFile: values.yaml

# fleets, gameserversets and gameservers are each over 500 KB. Client-side
# apply would overflow the 262144-byte last-applied-configuration annotation.
patches:
- target:
    kind: CustomResourceDefinition
  patch: |-
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: unused
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
