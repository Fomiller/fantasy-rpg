# The Console has no login of its own. homelab lists this hostname in
# protected_hostnames, so Cloudflare Access stops anyone without a session
# before the tunnel sends the request to Traefik.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redpanda-console
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`redpanda-frpg-dev.fomiller.com`)
      kind: Rule
      services:
        - name: console
          port: 8080
