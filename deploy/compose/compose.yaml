name: fantasy-rpg

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
      POSTGRES_DB: fantasy
    ports:
      - "5432:5432"
    volumes:
      # The 18 image keeps its data under a versioned dir in here. A 17 volume
      # will not start on it: reset it with `docker compose down -v`.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fantasy"]
      interval: 2s
      retries: 15

  nats:
    image: nats:2
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  world-server:
    profiles: [full]
    image: fantasy-rpg/world-server:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: world-server
    environment:
      DATABASE_URL: postgres://fantasy:fantasy@postgres:5432/fantasy?sslmode=disable
      JOIN_TOKEN_KEY: dev-only
      # Polled inside the network, handed to the client as localhost.
      INSTANCES: >-
        instance-0=http://instance-0:8080=ws://localhost:8081/instances/instance-0/ws
        instance-1=http://instance-1:8080=ws://localhost:8082/instances/instance-1/ws
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started

  migrate:
    profiles: [full]
    image: fantasy-rpg/instance-server:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: instance-server
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://fantasy:fantasy@postgres:5432/fantasy?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  instance-0: &instance
    profiles: [full]
    image: fantasy-rpg/instance-server:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: instance-server
    environment: &instance-env
      DATABASE_URL: postgres://fantasy:fantasy@postgres:5432/fantasy?sslmode=disable
      JOIN_TOKEN_KEY: dev-only
      INSTANCE_ID: instance-0
    ports:
      - "8081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  instance-1:
    <<: *instance
    environment:
      <<: *instance-env
      INSTANCE_ID: instance-1
    ports:
      - "8082:8080"

volumes:
  postgres-data:
