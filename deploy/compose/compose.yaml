name: fantasy-rpg

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
      POSTGRES_DB: fantasy
    ports:
      - "5432:5432"
    volumes:
      # The 18 image keeps its data under a versioned dir in here. A 17 volume
      # will not start on it: reset it with `docker compose down -v`.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fantasy"]
      interval: 2s
      retries: 15

  # One node in dev mode, no auth. `just deps` creates the topics. Containers
  # use redpanda:9092, the host uses localhost:19092.
  redpanda:
    image: redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092 | grep -q 'Healthy:.*true'"]
      interval: 2s
      retries: 15

  world-server:
    profiles: [full]
    image: fantasy-rpg/world-server:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: world-server
    environment:
      DATABASE_URL: postgres://fantasy:fantasy@postgres:5432/fantasy?sslmode=disable
      JOIN_TOKEN_KEY: dev-only
      KAFKA_BROKERS: redpanda:9092
      # Polled inside the network, handed to the client as localhost.
      INSTANCES: >-
        instance-0=http://instance-0:8080=ws://localhost:8081/instances/instance-0/ws
        instance-1=http://instance-1:8080=ws://localhost:8082/instances/instance-1/ws
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy

  migrate:
    profiles: [full]
    image: fantasy-rpg/instance-server:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: instance-server
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://fantasy:fantasy@postgres:5432/fantasy?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  instance-0: &instance
    profiles: [full]
    image: fantasy-rpg/instance-server:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: instance-server
    environment: &instance-env
      DATABASE_URL: postgres://fantasy:fantasy@postgres:5432/fantasy?sslmode=disable
      JOIN_TOKEN_KEY: dev-only
      INSTANCE_ID: instance-0
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy

  instance-1:
    <<: *instance
    environment:
      <<: *instance-env
      INSTANCE_ID: instance-1
    ports:
      - "8082:8080"

volumes:
  postgres-data:
