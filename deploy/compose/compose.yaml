name: fantasy-rpg

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
      POSTGRES_DB: fantasy
    ports:
      - "5432:5432"
    volumes:
      # The 18 image keeps its data under a versioned dir in here. A 17 volume
      # will not start on it: reset it with `docker compose down -v`.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fantasy"]
      interval: 2s
      retries: 15

  nats:
    image: nats:2
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  world-server:
    profiles: [full]
    image: fantasy-rpg/world-server:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: world-server
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  migrate:
    profiles: [full]
    image: fantasy-rpg/cave-server:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: cave-server
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://fantasy:fantasy@postgres:5432/fantasy?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  cave-server:
    profiles: [full]
    image: fantasy-rpg/cave-server:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BINARY: cave-server
    environment:
      DATABASE_URL: postgres://fantasy:fantasy@postgres:5432/fantasy?sslmode=disable
    ports:
      - "8081:8080"
    depends_on:
      world-server:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
