# INSTANCE_ID is replaced by `just instance-start <id>`.
apiVersion: v1
kind: Pod
metadata:
  name: instance-INSTANCE_ID
  namespace: fantasy-rpg
  labels:
    app: instance-server
    instance-id: "INSTANCE_ID"
spec:
  restartPolicy: Never
  containers:
    - name: instance-server
      image: fantasy-rpg/instance-server:dev
      env:
        - name: INSTANCE_ID
          value: "instance-INSTANCE_ID"
        - name: JOIN_TOKEN_KEY
          value: dev-only
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
