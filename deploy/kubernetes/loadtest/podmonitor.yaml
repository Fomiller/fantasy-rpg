apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fantasy-rpg-bots
  labels:
    app.kubernetes.io/name: fantasy-rpg
    app.kubernetes.io/component: bot
    # kube-prometheus-stack only picks up monitors with its release label.
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: bot
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
