# Written once, then it is yours. `nix run .#generate` never touches it again.

# A hello-world until the repo has an image of its own. http-echo takes the
# port on the command line, so it serves on whatever port the chart declares.
image:
  repository: hashicorp/http-echo
  tag: "1.0"

args:
  - -listen=:7654
  - -text=hello from fantasy-rpg

# Empty here on purpose. The default image is public and needs no credential.
# An overlay pulling from a private registry names its own Secret — see
# argocd/overlays/values.app.base.yaml.
imagePullSecrets: []

# Plain configuration in the container env shape, e.g. TICK_RATE or LOOT_SEED.
env: []

# LOG_LEVEL and LOG_FORMAT for every Go container. level is debug, info, warn
# or error. format is json or text.
logging:
  level: info
  format: json

# The instance servers: an Agones Fleet. Each GameServer's name is its
# instance id and its route, /instances/<name>/. One instance per pod.
instances:
  # Players in one instance at once, joining or in the cave. Also the
  # capacity of each GameServer's runs list.
  maxPlayers: 8
  # A buffer FleetAutoscaler. It owns the Fleet's replicas.
  autoscaler:
    bufferSize: 1
    minReplicas: 1
    maxReplicas: 8

# The world server, instance-manager and inventory, from the same image with
# their own commands. The world has /ws and asks the manager for an instance.
# inventory is the only one with the database. Off by default because the
# default image above is http-echo, which has none of them.
world:
  enabled: false
  # A StatefulSet. Each pod is one town shard, world-0 up, and has its own
  # Service and route. replicas is how many run. maxShards is how many
  # Services and routes exist, so a scale-up needs no new route.
  replicas: 2
  maxShards: 4
  # Extra container env, in the same shape as env above.
  env: []

# inventory pods. Their outbox relays take turns through an advisory lock, so
# more than one is safe. A PDB keeps one up when there are two or more.
inventory:
  replicas: 2

# instance-manager pods. They run active-active with no leader, and a PDB keeps
# one up when there are two or more.
instanceManager:
  replicas: 2

# Always-on bots, off by default. bot-director decides how many run and sets
# the worker Deployment's replicas, ceil(bots / perPod). Each worker pod runs
# its share. Needs world.enabled. The target set with `just bots-set` lives
# in a ConfigMap the director makes, and wins over mode and count here once
# it exists. docs/src/design/bots.md has the rules.
bots:
  enabled: false
  # off, fill or fixed. fill keeps humans plus bots at count. fixed runs
  # count bots. Quoted, since YAML reads a bare off as false.
  mode: "off"
  count: 0
  perPod: 25
  # No mode runs more than maxWorkers * perPod bots.
  maxWorkers: 4
  fill:
    # Keep under TOWN_MAX_PLAYERS (32) and the Fleet's seats
    # (instances.autoscaler.maxReplicas * instances.maxPlayers), so bots
    # alone never fill the town or the caves.
    maxBots: 16
    # Bots over the wanted count that may wait out downDelay. Past it they
    # leave at once.
    slack: 2
    # Bots added or removed per round, every 5s.
    step: 2
    upDelay: 10s
    downDelay: 60s
  # What the bots dial. Empty is wss://<ingressRoute.host>/ws, or the world
  # Service with no host. via is Traefik's in-cluster Service, as in the
  # load test, so ticket URLs resolve too. Empty dials the URLs as they are.
  url: ""
  via: http://traefik.traefik.svc.cluster.local
  # Names are bot-<namePrefix>-<slot>, so the director's bots reuse a few
  # characters and never clash with the load test's bot-<index>-<n>.
  namePrefix: fill
  townTime: 30s
  # Bots a worker starts per second.
  ramp: 2

# The Secret the world and instance servers read JOIN_TOKEN_KEY from. Empty
# means neither gets one, which only the http-echo default can run without. Point it at a Secret
# from externalSecrets below.
joinKey:
  secretName: ""

# Redpanda for both servers' events, as host:port[,host:port]. Empty turns
# events off, so the servers run without a broker.
events:
  brokers: ""

# One Valkey for the town directory: each town shard's URL and head count,
# and each player's last shard. No persistence, since every key is rebuilt
# within one heartbeat. Off, the world server runs with no directory and
# takes every player itself.
valkey:
  enabled: false
  image:
    repository: valkey/valkey
    tag: 8.1.11-alpine
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

# PodMonitors for every server's /metrics. Needs the Prometheus operator's
# CRDs. labels go on each PodMonitor, for a Prometheus that selects by label.
# dashboards renders the Grafana dashboards in dashboards/ as ConfigMaps.
metrics:
  podMonitors: false
  dashboards: false
  interval: 15s
  labels: {}

# No host means no IngressRoute. The overlay that owns the hostname sets it.
ingressRoute:
  host: ""
  entryPoint: web

# Secrets this chart creates from the cluster's secret store. The map key names
# the Secret, so a key here is what an `envFrom` secretRef points at.
#
# Empty by default: rendering the chart should not need a ClusterSecretStore to
# exist. The overlay that deploys turns them on.
#
#   externalSecrets:
#     fantasy-rpg-application-secret:
#       secretStore:
#         name: aws-clustersecretstore
#       remoteKey: dev/fomiller/homelab/fantasy-rpg-application-secret
externalSecrets: {}

# A CloudNativePG Cluster for player data, plus the migrate Job that runs
# before every server rollout. Off by default for the same reason as
# externalSecrets: a plain render should not need the CNPG operator. With it
# off the server keeps the memory store.
postgres:
  enabled: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  database: fantasy
  owner: fantasy
  # A primary and one streaming replica, on different nodes, so a restart or a
  # node loss fails over. Postgres keeps the copies, so the volumes have one
  # Longhorn replica each. With instances: 1, go back to `longhorn`.
  instances: 2
  # Longhorn grows a volume but never shrinks one, so start small. A new class
  # only applies to volumes CNPG creates. See Persistence in the docs.
  storage:
    size: 2Gi
    storageClass: longhorn-single-replica
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # barman-cloud base backups and continuous WAL archiving to S3. Off by
  # default, since a plain render should not need the plugin's CRDs. The
  # credentials are IRSA: roleArn goes on the Cluster's ServiceAccount.
  backup:
    enabled: false
    destinationPath: ""
    roleArn: ""
    # Six fields, because CNPG counts seconds. 03:00, clear of attic at 02:30.
    schedule: "0 0 3 * * *"
    retentionPolicy: 30d
