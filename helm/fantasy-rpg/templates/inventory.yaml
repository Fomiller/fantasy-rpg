{{- /* inventory: characters, stashes and the run lease behind an HTTP API.
       The only workload with DATABASE_URL. Off with the world server, since
       the default image has no /inventory. */ -}}
{{- if .Values.world.enabled }}
{{- $name := include "chart.inventoryName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart.inventorySelectorLabels" . | nindent 4 }}
  annotations:
    {{- /* After the migrate Job (0), so it never starts on an older schema. */}}
    argocd.argoproj.io/sync-wave: "1"
spec:
  {{- /* With autoscaling on, KEDA owns the replicas. */}}
  {{- if not .Values.inventory.autoscaling.enabled }}
  replicas: {{ .Values.inventory.replicas }}
  {{- end }}
  {{- /* Replicas share the outbox relay through an advisory lock, so a new pod
         can start before the old one stops. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "chart.inventorySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.inventorySelectorLabels" . | nindent 8 }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "chart.inventorySelectorLabels" . | nindent 20 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: inventory
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: [/inventory]
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "chart.loggingEnv" . | nindent 12 }}
            {{- if .Values.events.brokers }}
            {{- include "chart.eventsEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            {{- include "chart.databaseEnv" . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart.inventorySelectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "chart.inventorySelectorLabels" . | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
{{- if or .Values.inventory.autoscaling.enabled (gt (int .Values.inventory.replicas) 1) }}
---
{{- /* The join path needs one inventory pod up. */}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart.inventorySelectorLabels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "chart.inventorySelectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
