{{- /* Written once, then it is yours. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  annotations:
    {{- /* After the Cluster (-1) and the migrate Job (0), so the server never
           starts on a schema older than its own. */}}
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.replicas }}
  {{- /* One cave lives in one process's memory. A rolling update would run two
         caves at once and split the players between them. */}}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- /* Omitted entirely when empty, so a chart rendered against a public
             registry carries no reference to a Secret that isn't there. */}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
          {{- if or .Values.env .Values.postgres.enabled }}
          env:
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            {{- include "chart.databaseEnv" . | nindent 12 }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
