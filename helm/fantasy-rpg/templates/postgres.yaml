{{- /* The game's Postgres, run by the CloudNativePG operator the homelab
       already installs. CNPG writes <cluster>-app with a ready `uri`, so no
       password lives in git or the secret store. */ -}}
{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "chart.dbName" . }}
  labels:
    {{- include "chart.selectorLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    {{- /* CNPG owns the PVC through the Cluster, so a prune deletes the data.
           Removing the database is a job for a person. */}}
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: 1
  {{- /* Pinned: CNPG never does an implicit major upgrade, so a floating tag
         can strand the cluster on an operator bump. */}}
  imageName: {{ .Values.postgres.imageName }}
  {{- with .Values.postgres.backup }}
  {{- if .enabled }}
  {{- /* isWALArchiver is what makes recovery continuous. Without it a restore
         only reaches the last base backup. */}}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "chart.dbName" $ }}-backup
  {{- /* CNPG names the ServiceAccount after the Cluster, and the role's trust
         policy pins that name. Renaming the Cluster breaks backups. */}}
  serviceAccountTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: {{ required "postgres.backup.roleArn is required" .roleArn }}
  {{- end }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    storageClass: {{ .Values.postgres.storage.storageClass }}
  {{- with .Values.postgres.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  monitoring:
    enablePodMonitor: true
{{- end }}
