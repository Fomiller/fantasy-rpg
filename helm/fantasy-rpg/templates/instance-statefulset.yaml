{{- /* The instance servers. A StatefulSet for the stable pod names, not for
       storage: the name is the instance id, the route and the run lease's
       owner. One Service per pod, so the world server and Traefik can reach
       one instance and not any of them. */ -}}
{{- $name := include "chart.instanceName" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart.instanceSelectorLabels" . | nindent 4 }}
  annotations:
    {{- /* After the Cluster (-1) and the migrate Job (0), so a server never
           starts on a schema older than its own. */}}
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.instances.replicas }}
  serviceName: {{ $name }}
  {{- /* The pods do not depend on each other, so one stuck pod should not
         hold up the rest. */}}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "chart.instanceSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.instanceSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Soft, so a one-node cluster still runs every pod. Two on one node
             also make the descheduler's RemoveDuplicates pick on them. */}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "chart.instanceSelectorLabels" . | nindent 20 }}
      {{- /* DRAIN_TIMEOUT's 600 s for runs to finish, then time for the last
             run ends to land. */}}
      terminationGracePeriodSeconds: 630
      containers:
        - name: instance
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
          env:
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MAX_PLAYERS
              value: {{ .Values.instances.maxPlayers | quote }}
            {{- if .Values.events.brokers }}
            {{- include "chart.eventsEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.joinKey.secretName }}
            {{- include "chart.joinKeyEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            {{- include "chart.databaseEnv" . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
---
{{- /* An eviction kills every run in the instance, and run state is only in
       memory. The descheduler and node drains evict through the eviction
       API, so this stops both. FOM-112 owns draining an instance gracefully. */}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart.instanceSelectorLabels" . | nindent 4 }}
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "chart.instanceSelectorLabels" . | nindent 6 }}
---
{{- /* The StatefulSet's governing Service. Nothing connects through it. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart.instanceSelectorLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "chart.instanceSelectorLabels" . | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
{{- range $i := until (int .Values.instances.replicas) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%d" $name $i }}
  labels:
    {{- include "chart.instanceSelectorLabels" $ | nindent 4 }}
spec:
  selector:
    {{- include "chart.instanceSelectorLabels" $ | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ printf "%s-%d" $name $i }}
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
