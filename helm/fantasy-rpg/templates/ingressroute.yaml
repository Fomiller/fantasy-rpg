{{- /* Traefik's own CRD, like the blog. The Cloudflare tunnel forwards the
       hostname to Traefik, and Traefik passes the WebSocket upgrade through.
       /ws is the world server's front door, and /towns/{id}/ws is one
       shard, one route for each ordinal up to world.maxShards. A route to a
       pod that is not running gets a 503 from Traefik. instance-manager makes
       each instance's route, so it is not here. Off unless an overlay sets a
       host. */}}
{{- if and .Values.ingressRoute.host .Values.world.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "chart.fullname" . }}
spec:
  entryPoints:
    - {{ .Values.ingressRoute.entryPoint }}
  routes:
    - match: Host(`{{ .Values.ingressRoute.host }}`) && Path(`/ws`)
      kind: Rule
      services:
        - name: {{ include "chart.fullname" . }}-world
          port: 8080
    {{- range $i := until (int .Values.world.maxShards) }}
    {{- $shard := include "chart.worldShardName" (list $ $i) }}
    - match: Host(`{{ $.Values.ingressRoute.host }}`) && Path(`/towns/{{ $shard }}/ws`)
      kind: Rule
      services:
        - name: {{ $shard }}
          port: 8080
    {{- end }}
{{- end }}
