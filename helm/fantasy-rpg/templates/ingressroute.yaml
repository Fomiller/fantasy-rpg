{{- /* Traefik's own CRD, like the blog. The Cloudflare tunnel forwards the
       hostname to Traefik, and Traefik passes the WebSocket upgrade through.
       /ws is the world server's front door, and /towns/{id}/ws is one
       shard. With one world pod the Service reaches it for any id. Per-shard
       routes come with the StatefulSet. instance-manager makes each instance's
       route, so it is not here. Off unless an overlay sets a host. */}}
{{- if and .Values.ingressRoute.host .Values.world.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "chart.fullname" . }}
spec:
  entryPoints:
    - {{ .Values.ingressRoute.entryPoint }}
  routes:
    - match: Host(`{{ .Values.ingressRoute.host }}`) && (Path(`/ws`) || PathPrefix(`/towns/`))
      kind: Rule
      services:
        - name: {{ include "chart.fullname" . }}-world
          port: 8080
{{- end }}
