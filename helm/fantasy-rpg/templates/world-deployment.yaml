{{- /* The world server: join, the lobby, the stash, and tickets into an
       instance. It runs from the same image as the instance servers and has
       the public /ws. */ -}}
{{- if .Values.world.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-world
  labels:
    {{- include "chart.worldSelectorLabels" . | nindent 4 }}
  annotations:
    {{- /* After the migrate Job (0), like the instance server. */}}
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  {{- /* One connection per name lives in one process. Two world servers at
         once could each hold a lobby for the same player. */}}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart.worldSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.worldSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: world
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: [/world-server]
          ports:
            - containerPort: 8080
          env:
            {{- with .Values.world.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- include "chart.instancesEnv" . | nindent 12 }}
            {{- if .Values.events.brokers }}
            {{- include "chart.eventsEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.joinKey.secretName }}
            {{- include "chart.joinKeyEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            {{- include "chart.databaseEnv" . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-world
  labels:
    {{- include "chart.worldSelectorLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "chart.worldSelectorLabels" . | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
