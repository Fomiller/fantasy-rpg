{{- /* Written once, then it is yours. */ -}}
{{- /*
Secrets this chart needs, pulled from wherever the cluster keeps them. The
chart holds references, never values, so nothing sensitive appears in a
rendered chart or an Argo CD diff.

Empty by default: `helm template` and a local render should not depend on a
ClusterSecretStore existing. The overlay that deploys turns them on.
*/ -}}
{{- range $name, $secret := .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart.selectorLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $secret.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ $secret.secretStore.kind | default "ClusterSecretStore" }}
    name: {{ required (printf "externalSecrets.%s.secretStore.name is required" $name) $secret.secretStore.name }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required (printf "externalSecrets.%s.remoteKey is required" $name) $secret.remoteKey }}
{{- end }}